name: Draft release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release origin and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 Tools/release-check.py --plist Resources/Info.plist --tag "$RELEASE_TAG"
      - name: Test without hardware or root installation
        run: |
          bash test.sh
      - name: Optional Developer ID credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE$CERTIFICATE_PASSWORD$IDENTITY" ]; then
            test -z "$APPLE_ID$TEAM_ID$APP_PASSWORD"
            echo 'SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'Ad-hoc build: no Developer ID signature or notarization.' >> "$GITHUB_STEP_SUMMARY"
          else
            test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test -n "$IDENTITY"
            KEYCHAIN="$RUNNER_TEMP/statelite-signing.keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
            echo "::add-mask::$KEYCHAIN_PASSWORD"
            printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 1800 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN"
            echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID$TEAM_ID$APP_PASSWORD" ]; then
              test -n "$APPLE_ID" && test -n "$TEAM_ID" && test -n "$APP_PASSWORD"
              xcrun notarytool store-credentials StateLiteCI --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --keychain "$KEYCHAIN"
              echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
              echo 'NOTARY_KEYCHAIN_PROFILE=StateLiteCI' >> "$GITHUB_ENV"
            fi
          fi
      - name: Build paired signed app and release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/statelite-dist
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/statelite-dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/statelite-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.txt <<'EOF'
          Apple Silicon only; macOS 14 or newer. Fan support uses private AppleSMC interfaces and varies by hardware.
          See release-metadata.json for signatures. Ad-hoc builds are not Developer ID signed or notarized; Gatekeeper may block them.
          This is a draft awaiting maintainer review and explicit publication. No project open-source license has been granted.
          EOF
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "StateLite $RELEASE_TAG" --notes-file notes.txt --generate-notes
